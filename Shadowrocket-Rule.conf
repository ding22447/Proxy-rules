[Rule]
# 本机回环地址不经过代理，避免本机服务连接失败。
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
# 常见私有 IPv4 地址不经过代理，保证路由器、NAS 和局域网设备可访问。
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
# 常见私有 IPv4 地址不经过代理，保证路由器、NAS 和局域网设备可访问。
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
# 常见私有 IPv4 地址不经过代理，保证路由器、NAS 和局域网设备可访问。
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
# Apple 设备用此域名检测并触发公共 Wi-Fi 认证页，因此必须直连。
DOMAIN,captive.apple.com,DIRECT
# Android 系统用此域名检测网络连通性，因此必须直连以正确触发认证页。
DOMAIN,connectivitycheck.gstatic.com,DIRECT
# Windows 系统用此域名检测网络连通性，因此保持直连。
DOMAIN-SUFFIX,msftconnecttest.com,DIRECT
# Windows 网络状态检测域名保持直连，避免误报无互联网连接。
DOMAIN-SUFFIX,msftncsi.com,DIRECT
# 微信本地回调域名直接连接，配合下方 Host 映射使用。
DOMAIN,localhost.weixin.qq.com,DIRECT
# 微信官方域名显式直连，避免被默认代理策略意外接管。
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
# .local 域名通常用于局域网设备发现，因此不进入代理。
DOMAIN-SUFFIX,local,DIRECT
# .lan 与 home.arpa 常用于 NAS、路由器和家庭内网名称，保持直连。
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,home.arpa,DIRECT
# IPv4 反向解析域名走直连，避免局域网 PTR 查询发送到公共 DNS。
DOMAIN-SUFFIX,in-addr.arpa,DIRECT
# IPv6 反向解析域名走直连，避免局域网 PTR 查询发送到公共 DNS。
DOMAIN-SUFFIX,ip6.arpa,DIRECT

